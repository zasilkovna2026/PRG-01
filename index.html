<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRG-01 LIVE</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#00100b;color:#62ff9c;font:12px monospace}header{height:42px;border-bottom:1px solid #17613e;padding:12px;font-weight:bold}.ok{float:right}.wrap{display:grid;grid-template-columns:1fr 245px;height:calc(100% - 42px)}#scope{position:relative;overflow:hidden;background:radial-gradient(circle,#06301f 0,#00150e 55%,#000b08 100%)}canvas{width:100%;height:100%}aside{border-left:1px solid #17613e;padding:12px}h3{margin:0 0 14px}.row{border-bottom:1px solid #16462f;padding:7px 0}.dim{color:#3b9b67;font-size:10px}.bad{color:#ff6c6c}button{background:#052318;color:#62ff9c;border:1px solid #258b5b;padding:8px;margin:8px 3px 0 0}.note{margin-top:16px;color:#3b9b67}
#scope{height:calc(100vh - 42px)!important;width:100%!important;min-width:0!important;min-height:0!important}
#scope canvas{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;display:block!important}
</style></head>
<body><header>PRG-01 // AIRSPACE SURVEILLANCE <span class="ok" id="status">● CONNECTING</span></header><div class="wrap"><div id="scope"><canvas id="c"></canvas><div id="zoom" style="position:absolute;left:12px;bottom:12px;display:flex;gap:5px;align-items:center"><button id="minus">−</button><span id="zr" style="min-width:58px;text-align:center">100 NM</span><button id="plus">+</button></div></div><aside><h3>TRACK CONTROL</h3><div class="row"><span class="dim">SECTOR</span><br>PRAGUE / 01</div><div class="row"><span class="dim">SOURCE</span><br><span id="source">NET LIVE</span></div><div class="row"><span class="dim">RANGE</span><br>100 NM / 185 KM</div><div class="row"><span class="dim">TRACKS</span><br><span id="tracks">0</span></div><div class="row"><span class="dim">SELECTED TARGET</span><br><span id="sel">NO TARGET</span></div><button id="refresh">REFRESH</button><button id="full">FULL SCREEN</button><div class="note">REAL TRAFFIC ONLY<br>NET ADS-B FEED<br>LOCAL SDR STANDBY</div></aside></div>
<script>
const LAT=50.0755,LON=14.4378,RANGE=100, cv=document.getElementById('c'),x=cv.getContext('2d');let planes=[],sweep=0,viewRange=100;
function resize(){const el=document.getElementById('scope');const d=Math.min(devicePixelRatio||1,2);cv.width=Math.floor(el.clientWidth*d);cv.height=Math.floor(el.clientHeight*d)}addEventListener('resize',resize);requestAnimationFrame(()=>{resize();requestAnimationFrame(resize)});
function geo(lat,lon){let dy=(lat-LAT)*60,dx=(lon-LON)*60*Math.cos(LAT*Math.PI/180);return {d:Math.hypot(dx,dy),a:Math.atan2(dx,dy)}}
const AIRPORTS=[{id:'PRG',lat:50.1008,lon:14.26,rad:5,label:'VACLAV HAVEL / LKPR'}];
function draw(){let w=cv.width,h=cv.height,cx=w/2,cy=h/2,r=Math.min(w,h)*.43;x.clearRect(0,0,w,h);x.strokeStyle='#17613e';x.lineWidth=1*devicePixelRatio;for(let i=1;i<=4;i++){x.beginPath();x.arc(cx,cy,r*i/4,0,Math.PI*2);x.stroke()}for(let i=0;i<12;i++){let a=i*Math.PI/6;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.sin(a)*r,cy-Math.cos(a)*r);x.stroke()}x.fillStyle='#3b9b67';x.textAlign='center';x.fillText('000°',cx,cy-r-6);x.fillText('180°',cx,cy+r+14);x.fillText('270°',cx-r-18,cy);x.fillText('090°',cx+r+18,cy);sweep=(sweep+.008)%(Math.PI*2);x.save();x.translate(cx,cy);x.rotate(sweep);let g=x.createLinearGradient(0,0,r,0);g.addColorStop(0,'rgba(80,255,140,.02)');g.addColorStop(1,'rgba(80,255,140,.35)');x.fillStyle=g;x.beginPath();x.moveTo(0,0);x.arc(0,0,r,-.08,.08);x.closePath();x.fill();x.restore();x.textAlign='left';x.font=(11*devicePixelRatio)+'px monospace';
for(const a of AIRPORTS){let aq=geo(a.lat,a.lon);if(aq.d<viewRange){let ar=aq.d/viewRange*r,ax=cx+Math.sin(aq.a)*ar,ay=cy-Math.cos(aq.a)*ar,zr=Math.max(18*devicePixelRatio,a.rad/viewRange*r);x.save();x.strokeStyle='#39a873';x.setLineDash([5*devicePixelRatio,4*devicePixelRatio]);x.beginPath();x.arc(ax,ay,zr,0,Math.PI*2);x.stroke();x.setLineDash([]);x.fillStyle='#39a873';x.fillText(a.id+' AIRPORT',ax+zr+5*devicePixelRatio,ay);x.restore()}}
for(const p of planes){if(!p.lat||!p.lon)continue;let q=geo(p.lat,p.lon);if(q.d>viewRange)continue;let rr=q.d/viewRange*r,px=cx+Math.sin(q.a)*rr,py=cy-Math.cos(q.a)*rr;let alt=p.alt_baro??p.alt_geom??'---', heading=Number(p.track??p.true_heading??p.mag_heading??0)*Math.PI/180;
x.save();x.translate(px,py);x.rotate(heading);x.strokeStyle='#75ffad';x.lineWidth=Math.max(1,1.2*devicePixelRatio);let z=5*devicePixelRatio;
x.beginPath();x.moveTo(0,-1.7*z);x.lineTo(0,1.5*z);x.moveTo(-1.15*z,0);x.lineTo(0,-.55*z);x.lineTo(1.15*z,0);x.moveTo(-.55*z,1.25*z);x.lineTo(0,.85*z);x.lineTo(.55*z,1.25*z);x.stroke();x.restore();
let name=(p.flight||p.hex||'UNK').trim(), nearPrg=geo(p.lat,p.lon).d<7, low=(alt==='ground'||Number(alt)<3500);
if(!(nearPrg&&low)){x.fillStyle='#75ffad';x.fillText(name,px+8*devicePixelRatio,py-4*devicePixelRatio);x.fillText((alt==='ground'?'GROUND':alt+' FT'),px+8*devicePixelRatio,py+9*devicePixelRatio)}}requestAnimationFrame(draw)}draw();
async function load(){let st=document.getElementById('status');try{let r=await fetch('/.netlify/functions/aircraft',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();planes=(j.ac||j.aircraft||[]);document.getElementById('tracks').textContent=planes.filter(p=>p.lat&&p.lon&&geo(p.lat,p.lon).d<=viewRange).length;st.textContent='● DATA LINK LIVE';st.className='ok';document.getElementById('source').textContent='ADSB.LOL // LIVE'}catch(e){st.textContent='● LINK ERROR';st.className='ok bad';document.getElementById('source').textContent=e.message}}load();setInterval(load,3000);
cv.onclick=e=>{let rect=cv.getBoundingClientRect(),mx=(e.clientX-rect.left)*devicePixelRatio,my=(e.clientY-rect.top)*devicePixelRatio,cx=cv.width/2,cy=cv.height/2,r=Math.min(cv.width,cv.height)*.43,best=null,bd=30*devicePixelRatio;for(const p of planes){if(!p.lat||!p.lon)continue;let q=geo(p.lat,p.lon),rr=q.d/viewRange*r,px=cx+Math.sin(q.a)*rr,py=cy-Math.cos(q.a)*rr,d=Math.hypot(px-mx,py-my);if(d<bd){best=p;bd=d}}document.getElementById('sel').innerHTML=best?((best.flight||best.hex).trim()+'<br>ALT '+(best.alt_baro||best.alt_geom||'?')+' FT<br>GS '+(best.gs||'?')+' KT<br>HDG '+(best.track||'?')+'°'):'NO TARGET'};
document.getElementById('minus').onclick=()=>{viewRange=Math.min(250,viewRange+25);document.getElementById('zr').textContent=viewRange+' NM'};document.getElementById('plus').onclick=()=>{viewRange=Math.max(25,viewRange-25);document.getElementById('zr').textContent=viewRange+' NM'};document.getElementById('refresh').onclick=load;document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
</script></body></html>
